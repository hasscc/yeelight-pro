send_command:
  description: Send command to gateway
  fields:
    host:
      description: Gateway host
      example: 192.168.26.150
      required: true
      selector:
        text:
    method:
      description: Command method
      example: gateway_get.node
      required: true
      selector:
        text:
    params:
      description: Command params
      example: '{"id":0}'
      selector:
        object:
    throw:
      description: Throw result
      default: true
      example: true
      selector:
        boolean:

mock_incoming_message:
  description: Send command to gateway
  fields:
    host:
      description: Gateway host
      example: 192.168.26.150
      required: false
      selector:
        text:
    message:
      description: Mock message
      example: '{"id": 8218, "method": "gateway_post.event", "nodes": [{"params": {}, "value": "motion.false", "id": 301809111, "nt": 2}]}'
      required: true
      selector:
        text:

remove_stale_devices:
  description: Remove devices that are no longer present in the gateway topology
  fields:
    host:
      description: Gateway host (optional, removes from all gateways if not specified)
      example: 192.168.26.150
      required: false
      selector:
        text:
    dry_run:
      description: If true, only shows which devices would be removed without actually removing them
      default: false
      example: true
      selector:
        boolean:
